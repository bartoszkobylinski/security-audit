name: Test

# Runs the audit workflow's own step scripts against local stand-ins, so a
# change to how a tool is fetched is tested before callers pin it.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  install-gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install gitleaks step retries a transient 5xx and keeps the checksum
        run: bash tests/install-gitleaks.sh
